name: Deploy Web (heedapp.co)

# Builds the landing page + web app and publishes them to the gh-pages branch
# (which heedapp.co serves) on every push to main. Fully automatic — no manual
# deploy step needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app (served at heedapp.co/app/)
        run: npx vite build --base=/app/ --outDir dist-web

      - name: Assemble site (landing at root + app under /app/)
        run: |
          mkdir -p site/app
          cp landing/index.html landing/auth.html landing/favicon.svg landing/heed-logo-full.png site/
          cp -R dist-web/* site/app/
          # Keep the custom domain on every publish.
          echo 'heedapp.co' > site/CNAME

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Auto-deploy web: ${{ github.sha }}"

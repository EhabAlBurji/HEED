<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heed</title>
    <!-- Apply saved theme before first paint — prevents flash of wrong theme. Default = dark. -->
    <script>
      try {
        var s = localStorage.getItem("heed-ui-store");
        var t = s ? JSON.parse(s)?.state?.theme : "dark";
        if (t === "system") {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
        } else if (t === "dark" || !t) {
          document.documentElement.classList.add("dark");
        }
      } catch(e) { document.documentElement.classList.add("dark"); }
    </script>
    <!-- App icon: browser-tab favicon + iOS/Android home-screen shortcut -->
    <link rel="icon" type="image/png" href="./heed-icon.png" />
    <link rel="apple-touch-icon" href="./heed-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Heed" />
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

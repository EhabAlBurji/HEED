<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heed — Signing you in…</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(103,53,225,0.12) 0%, transparent 60%),
        radial-gradient(circle, rgba(120,120,140,0.12) 1px, transparent 1px) 0 0 / 22px 22px,
        #0e0f1a;
      color: #f4f4f6;
    }
    .card {
      max-width: 420px; margin: 24px; padding: 40px 32px; text-align: center;
      background: rgba(20,21,34,0.9); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; box-shadow: 0 8px 32px rgba(103,53,225,0.35); }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #9a9bb0; margin: 0 0 20px; }
    .btn {
      display: inline-block; cursor: pointer; border: 0; padding: 12px 22px; border-radius: 14px;
      font-size: 14px; font-weight: 600; color: #fff; text-decoration: none;
      background: linear-gradient(135deg, #6735E1 0%, #8B5CF6 100%);
      box-shadow: 0 8px 24px rgba(103,53,225,0.32);
    }
    .muted { margin-top: 14px; font-size: 12px; color: #6f7088; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 100 100" aria-label="Heed"><rect width="100" height="100" rx="28" fill="#6735E1"/><path d="M30 22 h12 v22 h16 v-22 h12 v56 h-12 v-22 h-16 v22 h-12 z" fill="white"/></svg>
    <h1 id="title">✓ تم تسجيل الدخول</h1>
    <p id="msg">بنرجّعك لتطبيق Heed… تقدر تقفل الصفحة دي.</p>
    <a class="btn" id="openApp" href="#">افتح Heed</a>
    <button class="btn" id="closeBtn" style="margin-inline-start:8px;background:rgba(255,255,255,0.1);box-shadow:none">إغلاق</button>
    <div class="muted">Heed — You can close this tab.</div>
  </div>

  <script>
    // Forward the OAuth result (code/tokens) to the desktop app via its deep
    // link, which the OS hands to Heed. The PKCE exchange happens inside the app.
    var qs = window.location.search || "";
    var hash = window.location.hash || "";
    var deep = "heed://auth-callback" + qs + hash;
    document.getElementById("openApp").href = deep;

    function go() { try { window.location.href = deep; } catch (e) {} }
    // Auto-open the app immediately.
    go();

    // Best-effort auto-close (browsers only allow closing script-opened tabs, so
    // this may be blocked — the user can use the Close button / just close it).
    function tryClose() { try { window.close(); } catch (e) {} }
    setTimeout(tryClose, 1200);
    document.getElementById("closeBtn").addEventListener("click", tryClose);
  </script>
</body>
</html>
